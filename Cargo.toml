[workspace]
resolver = "2"
members = [
  "crates/plugin-sdk",
  "crates/mcp-protocol",
  "crates/customer-config",
  "crates/error",
  "crates/policy",
  "crates/wasm-runtime",
  "crates/gateway",
  "crates/mcp",
  "crates/cli",
  "plugins/filters/pii",
  "plugins/shared/pii",
  "plugins/transforms/noop",
  "plugins/filters/email",
  "plugins/filters/ssn",
  "plugins/filters/payment-card",
  "plugins/crypto/envelope",
  "plugins/crypto/deterministic",
  "tests/plugins/transformer",
  "tests/plugins/transformer-context",
  "tests/plugins/binary-reductor",
]

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/231self/maskura"

[workspace.dependencies]
maskura-customer-config = { path = "crates/customer-config" }
maskura-mcp-protocol = { path = "crates/mcp-protocol" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
hex = "0.4"
uuid = { version = "1", features = ["v7", "v5", "v4"] }
rand = "0.10"
zeroize = "1"
bytes = "1"
csv-core = "0.1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"

ciborium = "0.2"
ed25519-dalek = "3"
ml-kem = "0.3"
x25519-dalek = { version = "3", default-features = false }
hkdf = "0.12"

wasmtime = "47"
wasmtime-wasi = "47"
wit-bindgen = "0.61"

addr-spec = "0.9"
card-validate = "2"

proptest = "1"

axum = "0.8"
tokio = { version = "1", features = ["full"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process"] }
aws-sigv4 = "1.5"
aws-credential-types = "1.3"
aws-smithy-http-client = { version = "1.3", default-features = false, features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = "1.14"
aws-smithy-types = "1.6"
md-5 = "0.10"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
psl = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono", "uuid"] }
async-trait = "0.1"

utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[profile.release]
lto = true
strip = true
opt-level = "s"
codegen-units = 1

services:
  # Zero-config local S3 appliance (ADR 0019): the maskura gateway itself,
  # auto-local mode, with the fixed dev root credential so SigV4 clients and
  # the gateway's S3 sink share one well-known principal.
  s3:
    image: ghcr.io/231self/maskura/maskura:v0.7.14@sha256:4600673d46dd309f03f16a77661f1d412f55c2696045248e5dde1b7bd2c449b1
    ports:
      - "9000:9000"
    environment:
      MASKURA_ROOT_USER: minioadmin
      MASKURA_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "maskura-gateway", "--healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - s3-data:/data

  gateway:
    build:
      context: ..
      dockerfile: local/Dockerfile
    ports:
      - "8080:8080"
    environment:
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      LISTEN_ADDR: 0.0.0.0:8080
      MASKURA_DEFAULT_PLUGIN: /app/pii-default.component.wasm
      AUTH_DISABLED: "true"
      MASKURA_KEYS_FILE: /app/data/keys.json
    volumes:
      - maskura-keys:/app/data
    depends_on:
      s3:
        condition: service_healthy

volumes:
  s3-data:
  maskura-keys:

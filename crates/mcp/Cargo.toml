[package]
name = "maskura-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local stdio MCP server for the Maskura object-processing gateway"
publish = false

[[bin]]
name = "maskura-mcp"
path = "src/maskura_mcp.rs"

[dependencies]
maskura-customer-config.workspace = true
maskura-mcp-protocol.workspace = true
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.1", features = ["server", "macros", "schemars", "transport-io"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"

[dev-dependencies]
maskura-gateway = { path = "../gateway" }
axum.workspace = true
http-body-util = "0.1"
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
tempfile = "3"
uuid.workspace = true

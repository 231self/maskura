[package]
name = "maskura-pipeline-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Exposes the deterministic software authenticator and attestation builders so
# dependent test suites share one fixture implementation.
test-util = ["dep:rand"]

[dependencies]
maskura-error = { path = "../error" }
serde.workspace = true
thiserror.workspace = true
toml = "0.8"
url = "2"
semver = "1"
ciborium.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
serde_json.workspace = true
sha2 = "0.10"
base64 = "0.23"
p256 = "0.13"
rand = { workspace = true, optional = true }

[dev-dependencies]
rand.workspace = true

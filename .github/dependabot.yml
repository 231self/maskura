version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types:
          - minor
          - patch
    # Breaking Rust releases frequently require coordinated ecosystem and code
    # migrations. Keep advisory scanning active, but schedule majors manually.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    # Generated SDK output is replaced by `just build-sdks`. The overlay is the
    # maintained source and is copied into every generated client.
    directory: /sdks/overlay/typescript
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      typescript-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major SDK crypto/toolchain upgrades need API migration and explicit
    # interoperability tests rather than an automated manifest-only bump.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Dependabot classifies pre-1 0.x jumps as minor even when the library's
      # API is breaking. Keep the post-quantum client upgrade coordinated with
      # its high-level key and envelope interoperability migration.
      - dependency-name: "@noble/post-quantum"
        versions:
          - ">=0.5.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      container-images:
        patterns:
          - "*"

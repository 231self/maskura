name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write
  packages: write

# Normalize reusable calls and tag pushes to the same version key. Preserve the
# running publisher; the next run must recheck release absence after it finishes.
concurrency:
  group: release-${{ github.repository }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: 2
  IMAGE: ghcr.io/${{ github.repository_owner }}/maskura/maskura
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag and version surfaces
        run: python3 scripts/check-release-contract.py --tag "${{ env.RELEASE_TAG }}"
      - name: Refuse existing releases and bind tag to source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B scripts/check-release-publication.py

  # Native per-arch builds: amd64 on the x64 runner, arm64 on the native
  # arm64 runner. No cross-compilation, so ring/aws-lc-sys/openssl-sys build
  # against each runner's own native libs. Both legs run in parallel.
  build:
    needs: contract
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check temporary SQLite exception before artifact builds
        run: python3 scripts/sqlite-guard.py

      - name: Install wasm-tools + build filters
        run: |
          cargo install --locked wasm-tools --version 1.255.0
          bash scripts/build-plugins.sh

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Build gateway, CLI, and MCP releases (${{ matrix.suffix }})
        run: |
          mkdir -p dist/components
          cargo build --locked --release -p maskura-gateway -p maskura-mcp -p maskura
          cp target/release/maskura-gateway dist/maskura-gateway
          cp target/release/maskura-mcp dist/maskura-mcp-linux-${{ matrix.suffix }}
          cp target/release/maskura dist/maskura-linux-${{ matrix.suffix }}
          cp -r target/components/. dist/components/
          version="${{ env.RELEASE_TAG }}"
          expected="maskura ${version#v}"
          test "$(dist/maskura-linux-${{ matrix.suffix }} --version)" = "$expected"

      - name: Recheck SQLite exception before artifact upload
        run: python3 scripts/sqlite-guard.py

      - name: Upload CLI and MCP binaries (${{ matrix.suffix }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: maskura-binaries-${{ matrix.suffix }}
          path: |
            dist/maskura-mcp-linux-${{ matrix.suffix }}
            dist/maskura-linux-${{ matrix.suffix }}
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.3.0
        with:
          driver: docker-container

      # Assembly-only build (seconds): COPYs the runner-built artifacts.
      - name: Build image (${{ matrix.suffix }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Resolve native loaded image once
        id: feedback-image
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}-${{ matrix.suffix }}
        run: |
          image_id="$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Install native smoke dependencies
        run: |
          python3 -m venv .release-venv
          . .release-venv/bin/activate
          python3 -m pip install awscli
          echo "$PWD/.release-venv/bin" >> "$GITHUB_PATH"

      - name: Boot-smoke image (${{ matrix.suffix }})
        env:
          IMAGE_REF: ${{ steps.feedback-image.outputs.image_id }}
        run: bash scripts/release-image-smoke.sh "$IMAGE_REF"

      - name: Qualify native child before push
        env:
          IMAGE_ID: ${{ steps.feedback-image.outputs.image_id }}
          ARCH: ${{ matrix.suffix }}
        run: |
          python3 -B scripts/release-feedback.py --execute --image-id "$IMAGE_ID" \
            --arch "$ARCH" --source-sha "$GITHUB_SHA" --version "${RELEASE_TAG#v}" \
            --phase native-child --report "dist/image-qualification/$ARCH/native-child.json"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Recheck SQLite exception before image push
        run: python3 scripts/sqlite-guard.py

      - name: Push image (${{ matrix.suffix }})
        id: pushed-child
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}-${{ matrix.suffix }}
          IMAGE_ID: ${{ steps.feedback-image.outputs.image_id }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')" = "$IMAGE_ID"
          docker push --platform "$PLATFORM" "$IMAGE_REF" > native-push.log
          digest="$(python3 -B scripts/release-feedback-receipts.py push-digest --manifest native-push.log)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Replay published child on the same native runner
        env:
          CHILD_DIGEST: ${{ steps.pushed-child.outputs.digest }}
          IMAGE_ID: ${{ steps.feedback-image.outputs.image_id }}
          ARCH: ${{ matrix.suffix }}
        run: |
          published="$IMAGE@$CHILD_DIGEST"
          docker pull --platform "linux/$ARCH" "$published"
          test "$(docker image inspect "$published" --format '{{.Id}}')" = "$IMAGE_ID"
          python3 -B scripts/release-feedback.py --execute --image-id "$IMAGE_ID" \
            --arch "$ARCH" --source-sha "$GITHUB_SHA" --version "${RELEASE_TAG#v}" \
            --phase published-replay --published-ref "$published" \
            --report "dist/image-qualification/$ARCH/published-replay.json"
          docker buildx imagetools inspect "$published" --raw > native-child-manifest.json
          python3 -B scripts/release-feedback-receipts.py seal \
            --local "dist/image-qualification/$ARCH/native-child.json" \
            --published "dist/image-qualification/$ARCH/published-replay.json" \
            --manifest native-child-manifest.json --source "$GITHUB_SHA" \
            --version "${RELEASE_TAG#v}" --arch "$ARCH" \
            --output "dist/image-qualification/$ARCH/qualified.json"

      - name: Upload qualified native child receipt (${{ matrix.suffix }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: maskura-image-receipt-${{ matrix.suffix }}
          path: dist/image-qualification/${{ matrix.suffix }}/
          if-no-files-found: error

  build-macos:
    needs: contract
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check temporary SQLite exception before artifact builds
        run: python3 scripts/sqlite-guard.py

      - name: Install wasm-tools and build filters
        run: |
          cargo install --locked wasm-tools --version 1.255.0
          bash scripts/build-plugins.sh

      - name: Build native CLI and MCP releases
        run: cargo build --locked --release -p maskura -p maskura-mcp

      - name: Smoke native binaries
        run: |
          version="${{ env.RELEASE_TAG }}"
          expected="maskura ${version#v}"
          test "$(target/release/maskura --version)" = "$expected"
          target/release/maskura --version
          test -x target/release/maskura-mcp
          file target/release/maskura | grep -q 'Mach-O 64-bit executable arm64'
          file target/release/maskura-mcp | grep -q 'Mach-O 64-bit executable arm64'

      - name: Stage Apple Silicon binaries
        run: |
          mkdir -p dist
          cp target/release/maskura dist/maskura-macos-arm64
          cp target/release/maskura-mcp dist/maskura-mcp-macos-arm64

      - name: Recheck SQLite exception before artifact upload
        run: python3 scripts/sqlite-guard.py

      - name: Upload Apple Silicon binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: maskura-binaries-macos-arm64
          path: |
            dist/maskura-macos-arm64
            dist/maskura-mcp-macos-arm64
          if-no-files-found: error

  release:
    needs: [build, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain for dependency guard
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Check temporary SQLite exception before release publication
        run: python3 scripts/sqlite-guard.py

      - name: Download CLI and MCP binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          pattern: maskura-binaries-*
          path: dist
          merge-multiple: true

      - name: Verify native artifact matrix
        run: |
          for suffix in linux-amd64 linux-arm64 macos-arm64; do
            test -s "dist/maskura-${suffix}"
            test -s "dist/maskura-mcp-${suffix}"
          done

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.3.0
        with:
          driver: docker-container

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download qualified child receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          pattern: maskura-image-receipt-*
          path: qualified-image-receipts

      - name: Bind both qualified native children
        id: qualified-children
        run: |
          python3 -B scripts/release-feedback-receipts.py children \
            --receipt qualified-image-receipts/maskura-image-receipt-amd64/qualified.json \
            --receipt qualified-image-receipts/maskura-image-receipt-arm64/qualified.json \
            --source "$GITHUB_SHA" --version "${RELEASE_TAG#v}" \
            --output dist/QUALIFIED_IMAGE_CHILDREN.json --github-output "$GITHUB_OUTPUT"

      - name: Merge multi-arch manifest from qualified digests
        env:
          AMD64_DIGEST: ${{ steps.qualified-children.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.qualified-children.outputs.arm64 }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ env.RELEASE_TAG }} \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$ARM64_DIGEST"

      - name: Resolve published image digests
        id: image-digests
        run: |
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest}}' > index-metadata.json
          canonical="$(python3 -B scripts/release-feedback-receipts.py canonical --manifest index-metadata.json)"
          docker buildx imagetools inspect "$IMAGE@$canonical" --raw > canonical-index.json
          python3 -B scripts/release-feedback-receipts.py index --canonical "$canonical" \
            --manifest canonical-index.json --source "$GITHUB_SHA" --version "${RELEASE_TAG#v}" \
            --receipt qualified-image-receipts/maskura-image-receipt-amd64/qualified.json \
            --receipt qualified-image-receipts/maskura-image-receipt-arm64/qualified.json \
            --github-output "$GITHUB_OUTPUT"
          printf '%s@%s\n' "${{ env.IMAGE }}" "$canonical" > dist/IMAGE_DIGESTS

      - name: Install proof dependencies
        run: |
          python3 -m venv .release-venv
          . .release-venv/bin/activate
          python3 -m pip install awscli ./sdks/python
          echo "$PWD/.release-venv/bin" >> "$GITHUB_PATH"

      - name: Prove the versioned image before promotion
        env:
          MASKURA_PROOF_IMAGE: ${{ env.IMAGE }}@${{ steps.image-digests.outputs.canonical }}
        run: bash examples/prove-maskura.sh

      - name: Attest canonical container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image-digests.outputs.canonical }}
          push-to-registry: true

      - name: Extract release artifacts from image
        env:
          AMD64_DIGEST: ${{ steps.qualified-children.outputs.amd64 }}
        run: |
          mkdir -p dist/plugins
          docker pull --platform linux/amd64 "$IMAGE@$AMD64_DIGEST"
          docker create --pull=never --name maskura-extract --platform linux/amd64 "$IMAGE@$AMD64_DIGEST"
          docker cp maskura-extract:/usr/local/bin/maskura-gateway dist/maskura-gateway-linux-x86_64
          docker cp maskura-extract:/app/components/. dist/plugins/
          docker rm maskura-extract
          tar -czf dist/maskura-plugins.tar.gz -C dist plugins
          npm install --prefix sdks/typescript --no-package-lock
          npm run --prefix sdks/typescript build
          python3 sdks/package-release.py --output-dir dist

      - name: Generate release SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/maskura-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate release checksums
        run: |
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum
          ) > dist/SHA256SUMS

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Recheck SQLite exception before promotion
        run: python3 scripts/sqlite-guard.py

      - name: Promote verified images to latest
        env:
          CANONICAL_DIGEST: ${{ steps.image-digests.outputs.canonical }}
        run: |
          docker buildx imagetools create \
             -t ${{ env.IMAGE }}:latest \
             ${{ env.IMAGE }}@${{ steps.image-digests.outputs.canonical }}
          docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' > latest-metadata.json
          test "$(python3 -B scripts/release-feedback-receipts.py canonical --manifest latest-metadata.json)" = "$CANONICAL_DIGEST"

      - name: Verify anonymous pullability before release
        run: |
          docker logout ghcr.io || true
          for tag in "${{ env.RELEASE_TAG }}" latest; do
            docker buildx imagetools inspect "${{ env.IMAGE }}:${tag}" >/dev/null
          done

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bash scripts/release-notes.sh "${{ env.RELEASE_TAG }}" release-notes.md

      - name: Recheck SQLite exception before GitHub Release
        run: python3 scripts/sqlite-guard.py

      - name: Create GitHub Release
        id: github-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
             dist/maskura-gateway-linux-x86_64 \
             dist/maskura-mcp-linux-amd64 \
             dist/maskura-mcp-linux-arm64 \
             dist/maskura-mcp-macos-arm64 \
             dist/maskura-linux-amd64 \
             dist/maskura-linux-arm64 \
             dist/maskura-macos-arm64 \
             dist/maskura-plugins.tar.gz \
             dist/maskura-python-sdk.tar.gz \
             dist/maskura-typescript-sdk.tar.gz \
             dist/maskura-sbom.spdx.json \
              dist/IMAGE_DIGESTS \
              dist/QUALIFIED_IMAGE_CHILDREN.json \
              dist/SHA256SUMS \
             --repo "${{ github.repository }}" \
             --verify-tag \
             --fail-on-no-commits \
             --notes-file release-notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Announce release on Discord
        if: steps.github-release.outputs.created == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/post-release-discord.sh "${{ env.RELEASE_TAG }}" release-notes.md

  verify-release:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.3.0
        with:
          driver: docker-container

      - name: Verify published image architectures
        # This job never logs in to GHCR. A successful inspect therefore proves
        # that the versioned manifest is anonymously pullable as well as complete.
        run: |
          docker buildx imagetools inspect \
            "${{ env.IMAGE }}:${{ env.RELEASE_TAG }}" \
            --format '{{json .Manifest}}' > manifest.json
          python3 - <<'PY'
          import json

          manifest = json.load(open("manifest.json", encoding="utf-8"))
          platforms = {
              (entry["platform"]["os"], entry["platform"]["architecture"])
              for entry in manifest["manifests"]
          }
          expected = {("linux", "amd64"), ("linux", "arm64")}
          if platforms != expected:
              raise SystemExit(f"published platforms {platforms!r}, expected {expected!r}")
          PY

      - name: Download and verify release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir verify-dist
          gh release download "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --dir verify-dist
          (cd verify-dist && sha256sum --check SHA256SUMS)
          for suffix in linux-amd64 linux-arm64 macos-arm64; do
            test -f "verify-dist/maskura-${suffix}"
            test -f "verify-dist/maskura-mcp-${suffix}"
          done
          test -f verify-dist/maskura-python-sdk.tar.gz
          test -f verify-dist/maskura-typescript-sdk.tar.gz
          test -f verify-dist/maskura-sbom.spdx.json
          test -f verify-dist/IMAGE_DIGESTS
          test -f verify-dist/QUALIFIED_IMAGE_CHILDREN.json
          canonical_digest="$(jq -r .digest manifest.json)"
          grep -Fx \
            "${{ env.IMAGE }}@${canonical_digest}" \
            verify-dist/IMAGE_DIGESTS
          gh attestation verify \
            --repo "${{ github.repository }}" \
            verify-dist/maskura-linux-amd64

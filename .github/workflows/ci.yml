name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Keep link-time memory bounded: matches GitHub's 2-vCPU runner and keeps
  # local (act/colima) builds from exhausting a shared Docker VM.
  CARGO_BUILD_JOBS: 2

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Proof harness syntax
        run: |
          bash -n examples/prove-maskura.sh examples/local-quickstart.sh examples/maskura-demo.sh scripts/bench-plugins.sh scripts/release-notes.sh scripts/post-release-discord.sh scripts/test-release-notifications.sh
          python3 -c 'import ast, pathlib; [ast.parse(path.read_text()) for path in map(pathlib.Path, ["examples/python-hybrid-roundtrip.py", "scripts/check-release-contract.py"])]'
          python3 scripts/check-release-contract.py
          bash scripts/test-release-notifications.sh
          python3 -m unittest discover -s tests -p 'test_release_image_smoke.py'
          python3 -m unittest discover -s tests -p 'test_release_proof.py'
          python3 -B -m unittest discover -s tests -p 'test_release_feedback.py'
          python3 -B -m unittest discover -s tests -p 'test_release_versioning.py'
          python3 -B -m unittest discover -s tests -p 'test_release_relay.py'
          python3 -B -m unittest discover -s tests -p 'test_release_publication.py'
          python3 -B -m unittest discover -s tests -p 'test_managed_linux_*.py'

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools --version 1.255.0
      - name: Build Wasm filters
        run: bash scripts/build-plugins.sh
      - name: Verify final-output validation regressions
        run: |
          set -o pipefail
          test -s target/test-components/test-transformer.component.wasm
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          cargo test --locked -p maskura-gateway --lib server::final_validation::tests | tee "$log"
          grep -E '^test result: ok\. 4 passed; 0 failed; 0 ignored;' "$log"
          cargo test --locked -p maskura-gateway --lib server::s3_upload::validation_tests | tee "$log"
          grep -E '^test result: ok\. 7 passed; 0 failed; 0 ignored;' "$log"
          cargo test --locked -p maskura-gateway --test final_output_validation | tee "$log"
          grep -E '^test result: ok\. 23 passed; 0 failed; 0 ignored;' "$log"
      - name: Test
        # Keep process-wide runtime/fixture admission tests isolated. Individual
        # concurrency tests still exercise their own real concurrent operations.
        run: cargo test --locked --workspace -- --test-threads=1
      - name: Real FileStore disk-exhaustion qualification
        run: bash scripts/test-filestore-enospc.sh

  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools --version 1.255.0
      - name: Build SDKs (drift check)
        if: ${{ !env.ACT }}
        run: |
          bash scripts/generate-sdks.sh
          python3 -m compileall -q sdks/python/maskura_client sdks/python/maskura_client
          python3 -m pip install -r sdks/python/requirements.txt pytest
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=sdks/python python3 -m pytest -q \
            sdks/python/test/test_highlevel_attach.py \
            sdks/python/test/test_highlevel_crypto.py
          cd sdks/typescript && npm install --ignore-scripts --no-package-lock && npm run build && node --test test/*.test.cjs
          cd ../..
          changes="$(git status --porcelain --untracked-files=all -- sdks/)"
          if [ -n "$changes" ]; then
            git diff -- sdks/
            git status --short --untracked-files=all -- sdks/
            exit 1
          fi

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools --version 1.255.0
      - name: End-to-end (local S3)
        if: ${{ !env.ACT }}
        run: bash scripts/e2e-local.sh

  release-image-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify temporary SQLite exception
        run: python3 scripts/sqlite-guard.py
      - name: Build components and packaged release binary
        env:
          ARCH: ${{ matrix.suffix }}
        run: |
          cargo install --locked wasm-tools --version 1.255.0
          bash scripts/build-plugins.sh
          mkdir -p dist/components
          cargo build --locked --release -p maskura-gateway -p maskura-mcp -p maskura
          cp target/release/maskura-gateway dist/maskura-gateway
          cp target/release/maskura-mcp "dist/maskura-mcp-linux-$ARCH"
          cp target/release/maskura "dist/maskura-linux-$ARCH"
          cp -r target/components/. dist/components/
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          expected="maskura ${version}"
          test "$(dist/maskura-linux-$ARCH --version)" = "$expected"
          python3 scripts/sqlite-guard.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.3.0
        with:
          driver: docker-container
      - name: Bind candidate version label
        id: feedback-version
        run: |
          python3 -c 'import re,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v); print("version="+v)' >> "$GITHUB_OUTPUT"
      - name: Build local image without publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: maskura-pr-smoke:${{ github.sha }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ steps.feedback-version.outputs.version }}
      - name: Resolve loaded candidate once
        id: feedback-image
        env:
          IMAGE_REF: maskura-pr-smoke:${{ github.sha }}-${{ matrix.suffix }}
        run: |
          image_id="$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
      - name: Install release proof dependencies
        run: |
          python3 -m venv .release-venv
          . .release-venv/bin/activate
          python3 -m pip install awscli ./sdks/python
          echo "$PWD/.release-venv/bin" >> "$GITHUB_PATH"
      - name: Real packaged-image smoke
        env:
          IMAGE_REF: ${{ steps.feedback-image.outputs.image_id }}
        run: bash scripts/release-image-smoke.sh "$IMAGE_REF"
      - name: Packaged FileStore feedback regressions before merge
        id: feedback-regressions
        env:
          IMAGE_ID: ${{ steps.feedback-image.outputs.image_id }}
          VERSION: ${{ steps.feedback-version.outputs.version }}
          ARCH: ${{ matrix.suffix }}
        run: |
          python3 -B scripts/release-feedback.py --execute --image-id "$IMAGE_ID" \
            --arch "$ARCH" --source-sha "$GITHUB_SHA" --version "$VERSION" \
            --phase candidate --report dist/candidate-feedback.json
      - name: Retain candidate feedback receipt (${{ matrix.suffix }})
        if: ${{ !cancelled() && (steps.feedback-regressions.outcome == 'success' || steps.feedback-regressions.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: maskura-candidate-feedback-${{ matrix.suffix }}-${{ github.run_attempt }}
          path: dist/candidate-feedback.json
          if-no-files-found: error
      - name: Prove the packaged image before merge
        env:
          MASKURA_PROOF_IMAGE: ${{ steps.feedback-image.outputs.image_id }}
          MASKURA_PROOF_IMAGE_LOCAL: "1"
        run: bash examples/prove-maskura.sh

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-trixie@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maskura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maskura"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maskura
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools --version 1.255.0
      - name: Build Wasm filters
        run: bash scripts/build-plugins.sh
      - name: Test Postgres migrations and secret envelopes
        run: cargo test --locked -p maskura-gateway --test db_keys_test
      - name: Verify recovery fixture does not poison later router startup
        run: |
          cargo test --locked -p maskura-gateway --test db_keys_test managed::postgres_recovery_binds_versioned_metadata_and_rejects_tampering -- --exact
          cargo test --locked -p maskura-gateway --test db_keys_test multipart::router_staged_multipart_flow_is_durable_and_idempotent -- --exact
      - name: Repeat Postgres suite against the same owned service
        run: cargo test --locked -p maskura-gateway --test db_keys_test

  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools --version 1.255.0
      - name: Build Wasm filters
        run: bash scripts/build-plugins.sh
      - name: Install AWS CLI and boto3
        run: |
          python3 -m pip install --user awscli boto3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Unmodified-client interop (AWS CLI + boto3)
        env:
          MASKURA_RUN_EXTERNAL_CLIENT_INTEROP: "1"
        run: cargo test --locked -p maskura-gateway --test s3_frontdoor_test available_aws_cli_and_boto3_interoperate

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install dependency scanners
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
          python3 -m pip install pip-audit==2.9.0
      - name: Dependency and supply-chain audit
        run: bash scripts/audit-dependencies.sh

  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - name: No dependency diff outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "dependency review applies to pull requests"

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4

  managed-release:
    permissions:
      contents: read
    uses: ./.github/workflows/managed-release.yml
    with:
      source_ref: ${{ github.sha }}

  # Aggregate status so branch protection's required `check` keeps working
  # and never ends up "skipped" when a constituent job fails.
  check:
    needs: [fmt, lint, test, sdk, e2e, release-image-smoke, postgres, managed-release, interop, security, dependency-review, codeql]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any check failed
        if: ${{ contains(join(needs.*.result, ','), 'failure') || contains(join(needs.*.result, ','), 'cancelled') || contains(join(needs.*.result, ','), 'skipped') }}
        run: exit 1
      - name: All checks passed
        if: ${{ !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') && !contains(join(needs.*.result, ','), 'skipped') }}
        run: echo "all checks passed"
